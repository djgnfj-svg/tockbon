<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 539" width="780" height="539" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<rect width="780" height="539" fill="#f7f5f0"/>
<text x="390" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#22201c">언제 무엇이 일어나나 — 때린 순간을 0 으로</text>
<text x="390" y="53" text-anchor="middle" font-size="12.5" fill="#6b665c">순서가 곧 느낌이다. 같은 효과라도 늦게 나오면 딴 일처럼 보인다.</text>
<line x1="197.7" y1="80" x2="197.7" y2="469.0" stroke="#ddd7ca" stroke-width="1"/>
<text x="197.7" y="72" text-anchor="middle" font-size="11.5" font-weight="400" fill="#8b8578">-0.5초</text>
<line x1="295.9" y1="80" x2="295.9" y2="469.0" stroke="#ddd7ca" stroke-width="1"/>
<line x1="394.2" y1="80" x2="394.2" y2="469.0" stroke="#c0392b" stroke-width="1.8"/>
<text x="394.2" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b">때린 순간</text>
<line x1="492.5" y1="80" x2="492.5" y2="469.0" stroke="#ddd7ca" stroke-width="1"/>
<text x="492.5" y="72" text-anchor="middle" font-size="11.5" font-weight="400" fill="#8b8578">0.25초</text>
<line x1="590.8" y1="80" x2="590.8" y2="469.0" stroke="#ddd7ca" stroke-width="1"/>
<text x="590.8" y="72" text-anchor="middle" font-size="11.5" font-weight="400" fill="#8b8578">0.5초</text>
<line x1="689.0" y1="80" x2="689.0" y2="469.0" stroke="#ddd7ca" stroke-width="1"/>
<text x="689.0" y="72" text-anchor="middle" font-size="11.5" font-weight="400" fill="#8b8578">0.75초</text>
<rect x="14" y="93.0" width="4" height="37.0" fill="#c7c0b2" rx="2"/>
<text x="26" y="106.0" font-size="11.5" font-weight="700" fill="#6b665c">직전</text>
<rect x="14" y="134.0" width="4" height="119.0" fill="#c7c0b2" rx="2"/>
<text x="26" y="147.0" font-size="11.5" font-weight="700" fill="#6b665c">그 순간</text>
<rect x="14" y="257.0" width="4" height="119.0" fill="#c7c0b2" rx="2"/>
<text x="26" y="270.0" font-size="11.5" font-weight="700" fill="#6b665c">맞은 뒤</text>
<rect x="14" y="380.0" width="4" height="78.0" fill="#c7c0b2" rx="2"/>
<text x="26" y="393.0" font-size="11.5" font-weight="700" fill="#6b665c">큰 한 방일 때만</text>
<text x="170" y="105.0" text-anchor="end" font-size="11.5" fill="#3a362f">1 예비 동작</text>
<rect x="315.6" y="96.0" width="70.8" height="11" fill="#7a8fa6" rx="3" opacity="0.9"/>
<text x="170" y="125.5" text-anchor="end" font-size="11.5" fill="#3a362f">2 예고 표시</text>
<rect x="197.7" y="116.5" width="157.2" height="11" fill="#7a8fa6" rx="3" opacity="0.9"/>
<text x="170" y="146.0" text-anchor="end" font-size="11.5" fill="#3a362f">3 히트스톱</text>
<rect x="394.2" y="137.0" width="31.4" height="11" fill="#c05a2e" rx="3" opacity="0.9"/>
<text x="170" y="166.5" text-anchor="end" font-size="11.5" fill="#3a362f">4 흰색 번쩍임</text>
<rect x="394.2" y="157.5" width="39.3" height="11" fill="#c05a2e" rx="3" opacity="0.9"/>
<text x="170" y="187.0" text-anchor="end" font-size="11.5" fill="#3a362f">5 화면 흔들기</text>
<rect x="394.2" y="178.0" width="59.0" height="11" fill="#c05a2e" rx="3" opacity="0.9"/>
<text x="170" y="207.5" text-anchor="end" font-size="11.5" fill="#3a362f">6 타격 그림</text>
<rect x="394.2" y="198.5" width="59.0" height="11" fill="#c05a2e" rx="3" opacity="0.9"/>
<text x="170" y="228.0" text-anchor="end" font-size="11.5" fill="#3a362f">7 튀는 조각</text>
<rect x="394.2" y="219.0" width="157.2" height="11" fill="#c05a2e" rx="3" opacity="0.9"/>
<text x="170" y="248.5" text-anchor="end" font-size="11.5" fill="#3a362f">8 소리</text>
<rect x="394.2" y="239.5" width="19.7" height="11" fill="#c05a2e" rx="3" opacity="0.9"/>
<text x="170" y="269.0" text-anchor="end" font-size="11.5" fill="#3a362f">9 밀려남</text>
<rect x="425.7" y="260.0" width="86.5" height="11" fill="#4f7d59" rx="3" opacity="0.9"/>
<text x="170" y="289.5" text-anchor="end" font-size="11.5" fill="#3a362f">10 멈칫</text>
<rect x="394.2" y="280.5" width="117.9" height="11" fill="#4f7d59" rx="3" opacity="0.9"/>
<text x="170" y="310.0" text-anchor="end" font-size="11.5" fill="#3a362f">11 눌리고 늘어나기</text>
<rect x="394.2" y="301.0" width="78.6" height="11" fill="#4f7d59" rx="3" opacity="0.9"/>
<text x="170" y="330.5" text-anchor="end" font-size="11.5" fill="#3a362f">12 잔상</text>
<rect x="394.2" y="321.5" width="78.6" height="11" fill="#4f7d59" rx="3" opacity="0.9"/>
<text x="170" y="351.0" text-anchor="end" font-size="11.5" fill="#3a362f">13 숫자 뜨기</text>
<rect x="413.9" y="342.0" width="294.8" height="11" fill="#4f7d59" rx="3" opacity="0.9"/>
<text x="170" y="371.5" text-anchor="end" font-size="11.5" fill="#3a362f">14 체력 바 지연</text>
<rect x="394.2" y="362.5" width="196.6" height="11" fill="#4f7d59" rx="3" opacity="0.9"/>
<text x="170" y="392.0" text-anchor="end" font-size="11.5" fill="#3a362f">15 카메라 당기기</text>
<rect x="394.2" y="383.0" width="157.2" height="11" fill="#8a6aa0" rx="3" opacity="0.9"/>
<text x="170" y="412.5" text-anchor="end" font-size="11.5" fill="#3a362f">16 느려짐</text>
<rect x="394.2" y="403.5" width="196.6" height="11" fill="#8a6aa0" rx="3" opacity="0.9"/>
<text x="170" y="433.0" text-anchor="end" font-size="11.5" fill="#3a362f">17 죽을 때 연출</text>
<rect x="394.2" y="424.0" width="235.9" height="11" fill="#8a6aa0" rx="3" opacity="0.9"/>
<text x="170" y="453.5" text-anchor="end" font-size="11.5" fill="#3a362f">18 가장자리 붉게</text>
<rect x="394.2" y="444.5" width="235.9" height="11" fill="#8a6aa0" rx="3" opacity="0.9"/>
<text x="390" y="495" text-anchor="middle" font-size="13" fill="#22201c">⚠ 3 번 히트스톱이 가장 싸고 가장 크게 바뀐다 — 때린 둘만 4~6 프레임 멈춘다</text>
<text x="390" y="517" text-anchor="middle" font-size="12" fill="#8b8578">⚠ 9 번 밀려남은 3 번이 끝난 뒤에 시작해야 한다. 멈춘 동안 밀리면 순간이동으로 보인다.</text>
</svg>