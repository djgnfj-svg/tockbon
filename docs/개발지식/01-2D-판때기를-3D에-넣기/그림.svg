<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="780" height="430" fill="#f7f5f0"/>
  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#22201c">가장 자주 틀리는 것 — 판때기가 도는 축</text>
  <text x="390" y="54" text-anchor="middle" font-size="12.5" fill="#6b665c">카메라를 아래로 내렸을 때, 옆에서 본 그림</text>

  <rect x="24" y="70" width="352" height="286" fill="#fff" stroke="#d8d2c6" stroke-width="1.5" rx="6"/>
  <text x="200" y="95" text-anchor="middle" font-size="14.5" font-weight="700" fill="#a33a2a">전 축 빌보드 — 지금 이 게임</text>
  <line x1="56" y1="304" x2="346" y2="304" stroke="#8b8578" stroke-width="2.5"/>
  <text x="58" y="322" font-size="11" fill="#8b8578">땅</text>
  <g transform="translate(76,128)">
    <path d="M0,0 L26,-11 L26,11 Z" fill="#4a4640"/><rect x="26" y="-9" width="20" height="18" fill="#4a4640" rx="2"/>
    <text x="-2" y="-18" font-size="11.5" fill="#4a4640">카메라</text>
  </g>
  <line x1="124" y1="136" x2="242" y2="256" stroke="#b7b0a2" stroke-width="1.3" stroke-dasharray="5 4"/>
  <g transform="translate(240,236) rotate(-40)">
    <rect x="-13" y="-58" width="26" height="116" fill="#c9dcea" stroke="#3b6b8f" stroke-width="2.2"/>
    <circle cx="0" cy="-38" r="7" fill="#3b6b8f"/>
  </g>
  <line x1="200" y1="288" x2="200" y2="304" stroke="#a33a2a" stroke-width="2"/>
  <line x1="194" y1="288" x2="206" y2="288" stroke="#a33a2a" stroke-width="2"/>
  <line x1="194" y1="304" x2="206" y2="304" stroke="#a33a2a" stroke-width="2"/>
  <text x="188" y="282" text-anchor="end" font-size="12.5" font-weight="700" fill="#a33a2a">발이 뜬다</text>
  <text x="200" y="340" text-anchor="middle" font-size="12.5" fill="#5a554c">카메라 쪽으로 눕는다 — 바닥 스티커가 된다</text>

  <rect x="404" y="70" width="352" height="286" fill="#fff" stroke="#d8d2c6" stroke-width="1.5" rx="6"/>
  <text x="580" y="95" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2f6b46">Y 축 고정 — 기법 1 번</text>
  <line x1="436" y1="304" x2="726" y2="304" stroke="#8b8578" stroke-width="2.5"/>
  <text x="438" y="322" font-size="11" fill="#8b8578">땅</text>
  <g transform="translate(456,128)">
    <path d="M0,0 L26,-11 L26,11 Z" fill="#4a4640"/><rect x="26" y="-9" width="20" height="18" fill="#4a4640" rx="2"/>
    <text x="-2" y="-18" font-size="11.5" fill="#4a4640">카메라</text>
  </g>
  <line x1="504" y1="136" x2="606" y2="244" stroke="#b7b0a2" stroke-width="1.3" stroke-dasharray="5 4"/>
  <g transform="translate(618,304)">
    <ellipse cx="0" cy="1" rx="21" ry="6" fill="#8b8578" opacity="0.5"/>
    <rect x="-13" y="-116" width="26" height="116" fill="#c9dcea" stroke="#3b6b8f" stroke-width="2.2"/>
    <circle cx="0" cy="-96" r="7" fill="#3b6b8f"/>
  </g>
  <text x="652" y="296" font-size="12.5" font-weight="700" fill="#2f6b46">발이 땅에 붙는다</text>
  <path d="M588,322 A34,11 0 1 0 648,322" fill="none" stroke="#2f6b46" stroke-width="1.8" stroke-dasharray="4 3"/>
  <path d="M648,322 l-7,-4 l1,8 z" fill="#2f6b46"/>
  <text x="580" y="340" text-anchor="middle" font-size="12.5" fill="#5a554c">좌우로만 돈다 — 선 채로</text>

  <text x="390" y="382" text-anchor="middle" font-size="13" fill="#22201c">차이는 한 줄 — <tspan font-family="monospace" font-size="12.5">billboard = BILLBOARD_FIXED_Y</tspan></text>
  <text x="390" y="406" text-anchor="middle" font-size="12" fill="#8b8578">⚠ 기법 2 번(카메라 각도 고정)과 한 쌍이다. 하나만 고치면 다른 쪽이 더 도드라진다.</text>
</svg>
