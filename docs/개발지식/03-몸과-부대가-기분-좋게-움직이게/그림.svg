<text x="580" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#2f6b46">한 명에 한 자리</text>
<text x="580" y="342" text-anchor="middle" font-size="12.5" fill="#5a554c">아홉이 보이고, 어디까지가 이 부대인지 보인다</text>
<text x="390" y="388" text-anchor="middle" font-size="13" fill="#22201c">⚠ 「한 칸에 아홉」이라고 정했는데 화면에는 열둘이 선다 — 그 답이 자리 수를 정한다</text>
<text x="390" y="410" text-anchor="middle" font-size="12" fill="#8b8578">⚠ 자리를 나눠도 19 번(도착 여유)이 없으면 몸이 제자리에서 떤다.</text>
