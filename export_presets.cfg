[preset.1]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; The godot_mcp addon is GONE (2026-08-27), and with it the whole knot this comment used to hold.
; It was an autoload the pck had to carry or the game failed on boot, so 456K of debug bridge shipped
; in every build as dead weight — its _ready returned immediately without a debugger attached.
; The MCP server that talked to it was never once used by this project: the game is launched by
; play.bat, the nets by tests/run_nets.ps1, and the screenshots by the scripts in tools/shot.
; ⇒ **There is no autoload at all now, and nothing in addons/.** If a debug bridge is ever wanted
; back, it comes back as a tool under tools/, not as something the shipped build has to carry.
exclude_filter="docs/*, tools/*, tests/*, .claude/*, *.md, image.png, image copy.png"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

