[preset.1]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; addons/godot_mcp/* is NOT excluded here, deliberately — project.godot declares
; MCPGameBridge as an autoload pointing into it, and an autoload is resolved from the pck at
; startup, before any of our code runs. Excluded, the pck does not contain the script the
; autoload names, and the game errors on boot rather than anywhere we could catch it.
; The script itself is inert in an export (its _ready returns on `not EngineDebugger.is_active()`),
; so what ships is dead weight, not behaviour.
; Excluding only part of the addon was measured and rejected: the autoload's closure spans
; game_bridge/ and core/ (MCPLog, MCPFrameProfiler, MCPRuntimeStateSampler, MCPExecGuard), and
; `class_name` is a project-global registry, so a partially-excluded addon can leave a
; registered name with no script behind it. The whole addon is 456K against a ~39MB build
; (the 37.7MB wasm is template-fixed), so a partial carve saves ~0.5% and buys back exactly
; the silent-boot-failure this line exists to remove.
exclude_filter="docs/*, tools/*, tests/*, .claude/*, *.md, map_draw.png, image.png, image copy.png"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
