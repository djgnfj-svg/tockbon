[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; ⚠⚠ **THE TWO PRESETS MUST CARRY THE SAME exclude_filter.** This is the Windows half; the Web half is
; identical and says so. A pattern added to one and not the other means the desktop build and the web
; build ship different files, and nothing in the repo measures that — it is caught by eye or not at all.
;
; ⚠ **Opening the Export dialog and touching anything rewrites this file and DROPS EVERY COMMENT in it.**
; If that happens, the filter strings survive (they are real fields) but this reasoning does not. Restore
; the comments from git rather than retyping them from memory.
;
; What each pattern is for, and why nothing narrower is here:
;   docs/*, tests/*, .claude/*  — planning, nets and harness config. None of it is reachable from
;                                 res://src/shell/game.tscn, all of it is text, none of it ships.
;   tools/*                     — 30MB of Blender/ComfyUI/screenshot instruments, including their own
;                                 output folders (tools/pixel/out, tools/shot/out, tools/blender/*.png).
;                                 ⚠ Excluding the folder is what makes those output folders safe; do NOT
;                                 replace this with per-file patterns.
;   build/*                     — **THE EXPORT OUTPUT DIRECTORY, and it feeds itself if left alone.**
;                                 Both presets write into build/, and the Web preset has
;                                 html/export_icon=true, which drops index.icon.png and
;                                 index.apple-touch-icon.png into build/web/. Those are PNGs sitting
;                                 inside the project folder, so the engine imports them like any other
;                                 texture and the NEXT export packs them — each round quietly carrying
;                                 the previous round's icons. build/ is gitignored (「내보낸 빌드 —
;                                 웹 하나가 39MB. 산출물이라 리포에 안 남긴다」), so nothing under it
;                                 can ever be a real asset. Added 2026-08-27.
;   *.md                        — README/CLAUDE/GLOSSARY at the root. docs/* covers the rest.
;   image.png, image copy.png   — root scratch images pasted in during a round. They are gitignored
;                                 root-anchored, and this filter is the build's half of that same
;                                 decision. ⚠ **If a name changes in .gitignore, change it here too.**
;   Godot_v*.exe                — the 170MB engine binary living in the project root (play.bat runs the
;                                 game with THAT engine on purpose, so it is not going anywhere).
;                                 ⚠ Belt-and-braces: the editor's filesystem does not index .exe, so
;                                 this is expected to be a no-op — but the downside if that assumption
;                                 is ever wrong is a 170MB pck, and no asset in this project is an .exe,
;                                 so the pattern cannot cost anything. Added 2026-08-27.
;
; ⚠⚠ **assets/ IS NOT FILTERED, ON PURPOSE.** On 2026-08-27 a pile of orphan art was found shipping in
; both builds — a folded prototype's body sprite, two unused beast sprites, two unused human sprites and
; a reference image. **The fix was deleting them, not filtering them.** A pattern aimed at "unused art"
; would have to guess which sprite is dead, and an exclude filter that drops a live asset produces a
; build that boots and then shows nothing — the worst failure this file can cause, and one no net here
; catches. ⇒ **Dead art leaves by `git rm`. This filter only ever names things that are non-shippable by
; their LOCATION.** Note also assets/font/OFL.txt: a licence file that MUST ship, which is why there is
; no `*.txt` pattern.
exclude_filter="docs/*, tools/*, tests/*, .claude/*, build/*, *.md, image.png, image copy.png, Godot_v*.exe"
export_path="build/tockbon.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name="tockbon"
application/file_description=""
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false

[preset.1]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; The godot_mcp addon is GONE (2026-08-27), and with it the whole knot this comment used to hold.
; It was an autoload the pck had to carry or the game failed on boot, so 456K of debug bridge shipped
; in every build as dead weight — its _ready returned immediately without a debugger attached.
; The MCP server that talked to it was never once used by this project: the game is launched by
; play.bat, the nets by tests/run_nets.ps1, and the screenshots by the scripts in tools/shot.
; ⇒ **There is no autoload at all now, and nothing in addons/.** If a debug bridge is ever wanted
; back, it comes back as a tool under tools/, not as something the shipped build has to carry.
;
; ⚠⚠ **This exclude_filter is CHARACTER-FOR-CHARACTER the Windows preset's, and it has to stay that way.**
; Every pattern is explained up there — including why build/* matters MORE here than anywhere else: this
; preset has html/export_icon=true below, so exporting web writes index.icon.png and
; index.apple-touch-icon.png into build/web/, and without build/* the next export of EITHER platform
; packs them. **Change one preset's filter and you must change the other's in the same edit.**
exclude_filter="docs/*, tools/*, tests/*, .claude/*, build/*, *.md, image.png, image copy.png, Godot_v*.exe"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
